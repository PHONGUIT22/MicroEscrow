<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#836EF9" />
      <stop offset="50%" stop-color="#6E56F8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141324" />
      <stop offset="100%" stop-color="#07070A" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#836EF9" stroke-width="2.5" stroke-opacity="0.5" />
  
  <!-- Subtle Glow Layer -->
  <path d="M64 22 L98 36 V62 C98 84 83 101 64 108 C45 101 30 84 30 62 V36 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="4" opacity="0.4" filter="url(#neonGlow)" />

  <!-- Main Shield Outline -->
  <path d="M64 24 L96 37 V62 C96 82 82 98 64 105 C46 98 32 82 32 62 V37 Z" 
        fill="#836EF9" fill-opacity="0.12" stroke="url(#shieldGrad)" stroke-width="5" stroke-linejoin="round" />

  <!-- Inner Escrow Lock / Core Diamond -->
  <path d="M64 42 L78 56 L64 70 L50 56 Z" 
        fill="url(#shieldGrad)" />
  <circle cx="64" cy="56" r="4" fill="#FFFFFF" />

  <!-- Lower Check / Secure Arc -->
  <path d="M52 78 L61 87 L77 71" 
        fill="none" stroke="#06B6D4" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
